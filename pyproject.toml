[project]
name = "ai-news-bot"
version = "0.1.0"
description = "AI news bot and dashboard shell"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.18.0",
    "openai>=1.0.0",
    "google-generativeai>=0.3.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "markdown>=3.5.0",
    "feedparser>=6.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.28.0",
    "pytest>=9.0.2",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.20",
]

[tool.uv]
package = false
