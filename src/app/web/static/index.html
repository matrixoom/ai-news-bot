<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>财经与政策情报终端</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside id="sidebar" class="sidebar reveal" aria-label="一级模块导航">
        <div class="brand-block">
          <p class="brand-kicker">MARKETS + POLICY DESK</p>
          <h1 id="heroTitle">财经与政策情报终端</h1>
          <p id="heroSubtitle" class="brand-subtitle">正在连接后端数据接口...</p>
        </div>

        <section class="sidebar-panel sidebar-meta">
          <p id="generatedAt" class="timestamp">更新时间: -</p>
          <div id="newsModeSwitch" class="mode-switch"></div>
        </section>

        <nav id="moduleNav" class="module-nav" aria-label="一级模块导航">
          <button type="button" class="module-button active" data-module-id="news">
            <span class="badge loading"><span class="loading-spinner loading-spinner-inline" aria-hidden="true"></span><span>加载中</span></span>
            <span class="module-button-title">新闻情报</span>
            <span class="module-button-note">等待加载</span>
          </button>
          <button type="button" class="module-button" data-module-id="macro">
            <span class="badge loading"><span class="loading-spinner loading-spinner-inline" aria-hidden="true"></span><span>加载中</span></span>
            <span class="module-button-title">宏观指标</span>
            <span class="module-button-note">等待加载</span>
          </button>
          <button type="button" class="module-button" data-module-id="market">
            <span class="badge loading"><span class="loading-spinner loading-spinner-inline" aria-hidden="true"></span><span>加载中</span></span>
            <span class="module-button-title">市场模型</span>
            <span class="module-button-note">等待加载</span>
          </button>
          <button type="button" class="module-button" data-module-id="events">
            <span class="badge loading"><span class="loading-spinner loading-spinner-inline" aria-hidden="true"></span><span>加载中</span></span>
            <span class="module-button-title">事件展望</span>
            <span class="module-button-note">等待加载</span>
          </button>
          <button type="button" class="module-button" data-module-id="status">
            <span class="badge loading"><span class="loading-spinner loading-spinner-inline" aria-hidden="true"></span><span>加载中</span></span>
            <span class="module-button-title">数据状态</span>
            <span class="module-button-note">等待加载</span>
          </button>
        </nav>

        <section class="sidebar-panel sidebar-note">
          <p class="sidebar-note-label">覆盖说明</p>
          <p id="coverageNote" class="sidebar-copy">正在读取运行状态...</p>
          <div class="quick-links">
            <a href="/api/frontend/dashboard" target="_blank" rel="noreferrer">Frontend API</a>
            <a href="/api/dashboard" target="_blank" rel="noreferrer">Legacy API</a>
            <a href="/legacy" target="_blank" rel="noreferrer">Legacy Page</a>
          </div>
        </section>
      </aside>

      <main class="stage">
        <header class="hero-panel reveal">
          <div class="hero-head">
            <button id="sidebarToggle" type="button" class="sidebar-toggle" aria-expanded="false" aria-controls="sidebar">
              模块
            </button>
            <div class="hero-copy">
              <p class="hero-kicker">Integrated Intelligence Workspace</p>
              <h2>今日工作台</h2>
              <p class="hero-text">左侧只保留一级模块，模块内具体内容与切换都放到右侧内容区。</p>
            </div>
            <span id="newsModeTag" class="mode-chip">Hybrid</span>
          </div>
          <section id="marketTicker" class="ticker" aria-label="顶部摘要行情">
            <span class="ticker-empty">行情条加载中...</span>
          </section>
        </header>

        <section class="module-panel reveal">
          <header class="module-header">
            <div>
              <p id="activeModuleEyebrow" class="module-eyebrow">新闻情报</p>
              <h3 id="activeModuleTitle">模块内容</h3>
              <p id="activeModuleDescription" class="module-description">右侧展示当前模块的具体数据内容。</p>
            </div>
            <div id="moduleStatus" class="module-status"></div>
          </header>

          <div id="detailTabs" class="detail-tabs" aria-label="模块内切换"></div>
          <section id="contentStage" class="content-canvas" aria-live="polite">
            <article class="info-card loading-card">
              <div class="card-head">
                <h4>数据加载中</h4>
                <span class="badge loading"><span class="loading-spinner loading-spinner-inline" aria-hidden="true"></span><span>加载中</span></span>
              </div>
              <div class="loading-card-copy">
                <span class="loading-spinner" aria-hidden="true"></span>
                <span>页面框架已渲染，各模块数据正在后台异步加载。</span>
              </div>
            </article>
          </section>
        </section>
      </main>
    </div>

    <script src="/static/app.js" defer></script>
  </body>
</html>
