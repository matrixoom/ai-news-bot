<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>事件洞察前端工作台 Mockup</title>
    <style>
      :root {
        --bg: #f1f5f9;
        --surface: #ffffff;
        --surface-soft: #f8fafc;
        --surface-selected: #eff6ff;
        --ink: #0f172a;
        --text: #334155;
        --muted: #64748b;
        --faint: #94a3b8;
        --line: #e2e8f0;
        --line-strong: #cbd5e1;
        --accent: #2563eb;
        --accent-soft: #dbeafe;
        --green: #059669;
        --green-soft: #d1fae5;
        --amber: #d97706;
        --amber-soft: #fef3c7;
        --rose: #e11d48;
        --rose-soft: #ffe4e6;
        --violet: #7c3aed;
        --violet-soft: #ede9fe;
        --shadow: 0 10px 24px rgb(15 23 42 / 0.05);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 1180px;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter,
          "Segoe UI",
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app {
        display: grid;
        min-height: 100vh;
        grid-template-columns: 248px minmax(0, 1fr);
      }

      .sidebar {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        border-right: 1px solid var(--line);
        background: #ffffff;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 68px;
        padding: 0 18px;
        border-bottom: 1px solid var(--line);
      }

      .brand-mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 10px;
        background: #0f172a;
        color: #ffffff;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: -0.08em;
      }

      .brand strong {
        display: block;
        font-size: 14px;
        letter-spacing: -0.01em;
      }

      .brand span {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 11px;
      }

      .nav {
        flex: 1;
        padding: 14px 10px;
      }

      .nav-section {
        margin: 16px 8px 7px;
        color: var(--faint);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.14em;
      }

      .nav-row,
      .nav-child {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: space-between;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--text);
        font-size: 13px;
        text-align: left;
      }

      .nav-row {
        padding: 9px 10px;
        font-weight: 700;
      }

      .nav-row:hover,
      .nav-child:hover {
        background: var(--surface-soft);
      }

      .nav-children {
        display: grid;
        gap: 2px;
        margin: 4px 0 4px 15px;
        padding-left: 10px;
        border-left: 1px solid var(--line);
      }

      .nav-child {
        padding: 8px 9px;
        color: var(--muted);
      }

      .nav-child.active {
        background: var(--surface-selected);
        color: #1d4ed8;
        font-weight: 800;
      }

      .nav-child.is-static::after {
        color: var(--faint);
        content: "默认";
        font-size: 10px;
      }

      .nav-foot {
        padding: 12px 16px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 11px;
        line-height: 1.6;
      }

      .workspace {
        min-width: 0;
      }

      .topbar {
        display: flex;
        height: 68px;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 0 24px;
        border-bottom: 1px solid var(--line);
        background: rgb(255 255 255 / 0.95);
      }

      .topbar h1 {
        margin: 0;
        font-size: 16px;
        letter-spacing: -0.01em;
      }

      .topbar p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .preview-switch {
        display: flex;
        align-items: center;
        gap: 3px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface-soft);
      }

      .preview-switch button {
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--muted);
        padding: 7px 10px;
        font-size: 12px;
        font-weight: 700;
      }

      .preview-switch button.active {
        background: #ffffff;
        color: var(--ink);
        box-shadow: 0 1px 3px rgb(15 23 42 / 0.08);
      }

      .page {
        padding: 20px 24px 24px;
      }

      .page-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      .page-heading h2 {
        margin: 0;
        font-size: 21px;
        letter-spacing: -0.03em;
      }

      .page-heading p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
      }

      .actions,
      .filters,
      .inline,
      .pagination {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .button {
        height: 34px;
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        background: #ffffff;
        color: var(--text);
        padding: 0 12px;
        font-size: 12px;
        font-weight: 800;
      }

      .button:hover {
        border-color: #94a3b8;
        background: var(--surface-soft);
      }

      .button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #ffffff;
      }

      .button.dark {
        border-color: #0f172a;
        background: #0f172a;
        color: #ffffff;
      }

      .button.compact {
        height: 28px;
        padding: 0 9px;
        font-size: 11px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
      }

      .search,
      .select,
      .field {
        height: 34px;
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        background: #ffffff;
        color: var(--text);
        padding: 0 10px;
        font-size: 12px;
      }

      .search {
        width: 235px;
      }

      .select {
        min-width: 112px;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        box-shadow: var(--shadow);
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 48px;
        gap: 12px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
      }

      .panel-head h3,
      .panel-head h4 {
        margin: 0;
        font-size: 13px;
      }

      .panel-head span {
        color: var(--muted);
        font-size: 11px;
      }

      .list-layout {
        display: grid;
        gap: 12px;
        grid-template-columns: minmax(0, 1fr) 330px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }

      th {
        height: 36px;
        border-bottom: 1px solid var(--line);
        background: var(--surface-soft);
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        text-align: left;
      }

      td {
        height: 58px;
        border-bottom: 1px solid var(--line);
        color: var(--text);
        font-size: 12px;
        line-height: 1.45;
        vertical-align: middle;
      }

      th,
      td {
        padding: 0 12px;
      }

      tbody tr:hover {
        background: var(--surface-soft);
      }

      tbody tr.selected {
        background: #eff6ff;
      }

      .event-title {
        display: block;
        overflow: hidden;
        color: var(--ink);
        font-weight: 800;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .subtle {
        color: var(--muted);
        font-size: 11px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 3px 7px;
        font-size: 10px;
        font-weight: 800;
        white-space: nowrap;
      }

      .badge.blue {
        background: var(--accent-soft);
        color: #1d4ed8;
      }

      .badge.green {
        background: var(--green-soft);
        color: #047857;
      }

      .badge.amber {
        background: var(--amber-soft);
        color: #b45309;
      }

      .badge.rose {
        background: var(--rose-soft);
        color: #be123c;
      }

      .badge.violet {
        background: var(--violet-soft);
        color: #6d28d9;
      }

      .drawer-body {
        padding: 14px;
      }

      .drawer-title {
        margin: 0;
        font-size: 15px;
        line-height: 1.5;
      }

      .drawer-note {
        margin: 9px 0 14px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.65;
      }

      .meta-list {
        display: grid;
        gap: 9px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }

      .meta-row {
        display: grid;
        gap: 6px;
        grid-template-columns: 72px 1fr;
        color: var(--text);
        font-size: 11px;
        line-height: 1.5;
      }

      .meta-row strong {
        color: var(--muted);
        font-weight: 700;
      }

      .drawer-section {
        margin-top: 16px;
      }

      .drawer-section h4,
      .rail-section h4 {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.09em;
      }

      .evidence-item {
        display: block;
        margin-bottom: 7px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 9px;
        color: var(--text);
        font-size: 11px;
        line-height: 1.55;
      }

      .evidence-item strong {
        display: block;
        margin-bottom: 3px;
        color: var(--ink);
        font-size: 11px;
      }

      .table-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 11px 12px;
        color: var(--muted);
        font-size: 11px;
      }

      .pagination button {
        min-width: 26px;
        height: 26px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: #ffffff;
        color: var(--muted);
        font-size: 11px;
      }

      .pagination button.active {
        border-color: var(--accent);
        background: var(--accent);
        color: #ffffff;
      }

      .metric-grid {
        display: grid;
        gap: 10px;
        margin-bottom: 12px;
        grid-template-columns: repeat(4, 1fr);
      }

      .metric {
        min-height: 82px;
        padding: 13px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
      }

      .metric span {
        color: var(--muted);
        font-size: 11px;
      }

      .metric strong {
        display: block;
        margin-top: 7px;
        font-size: 23px;
        letter-spacing: -0.04em;
      }

      .metric small {
        color: var(--green);
        font-size: 10px;
      }

      .trace-layout {
        display: grid;
        gap: 12px;
        grid-template-columns: minmax(0, 1fr) 320px;
      }

      .trace-body {
        padding: 14px;
      }

      .stage-strip {
        display: grid;
        margin-bottom: 16px;
        grid-template-columns: repeat(4, 1fr);
      }

      .stage {
        position: relative;
        min-height: 67px;
        padding: 9px 12px;
        border-top: 3px solid var(--line-strong);
        background: var(--surface-soft);
      }

      .stage.active {
        border-color: var(--accent);
        background: var(--surface-selected);
      }

      .stage:not(:last-child)::after {
        position: absolute;
        top: -3px;
        right: 0;
        width: 1px;
        height: 70px;
        background: var(--line);
        content: "";
      }

      .stage span {
        display: block;
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
      }

      .stage strong {
        display: block;
        margin-top: 7px;
        color: var(--text);
        font-size: 12px;
      }

      .timeline {
        position: relative;
        display: grid;
        gap: 12px;
        padding-left: 25px;
      }

      .timeline::before {
        position: absolute;
        top: 8px;
        bottom: 8px;
        left: 7px;
        width: 1px;
        background: var(--line-strong);
        content: "";
      }

      .timeline-entry {
        position: relative;
        display: grid;
        gap: 13px;
        grid-template-columns: 118px 1fr;
        padding: 11px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #ffffff;
      }

      .timeline-entry::before {
        position: absolute;
        top: 17px;
        left: -23px;
        width: 9px;
        height: 9px;
        border: 2px solid #ffffff;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
        content: "";
      }

      .timeline-entry time {
        color: var(--muted);
        font-size: 11px;
        line-height: 1.7;
      }

      .timeline-entry h4 {
        margin: 0;
        color: var(--ink);
        font-size: 12px;
      }

      .timeline-entry p {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.6;
      }

      .graph-layout {
        display: grid;
        min-height: 710px;
        gap: 12px;
        grid-template-columns: 208px minmax(0, 1fr) 290px;
      }

      .rail {
        padding: 12px;
      }

      .rail-section {
        padding-bottom: 14px;
      }

      .rail-section + .rail-section {
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }

      .check {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 8px 0;
        color: var(--text);
        font-size: 11px;
      }

      .check input {
        accent-color: var(--accent);
      }

      .relation-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
      }

      .relation-dot.cause {
        background: var(--accent);
      }

      .relation-dot.parallel {
        background: var(--violet);
      }

      .relation-dot.risk {
        background: var(--rose);
      }

      .relation-dot.follow {
        background: var(--green);
      }

      .graph {
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(circle at 1px 1px, #cbd5e1 1px, transparent 0) 0 0 / 18px 18px,
          #f8fafc;
      }

      .graph-toolbar {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 4;
        display: flex;
        gap: 4px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: rgb(255 255 255 / 0.92);
        box-shadow: var(--shadow);
      }

      .graph-toolbar button {
        width: 28px;
        height: 26px;
        border: 0;
        border-radius: 4px;
        background: #ffffff;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .edge {
        position: absolute;
        z-index: 1;
        height: 2px;
        transform-origin: 0 0;
      }

      .edge.cause {
        background: var(--accent);
      }

      .edge.parallel {
        background: var(--violet);
      }

      .edge.risk {
        background: var(--rose);
      }

      .edge.follow {
        background: var(--green);
      }

      .edge.dashed {
        height: 0;
        border-top: 2px dashed var(--rose);
      }

      .node {
        position: absolute;
        z-index: 2;
        width: 150px;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        background: #ffffff;
        padding: 10px;
        box-shadow: 0 8px 18px rgb(15 23 42 / 0.08);
      }

      .node.selected {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft), 0 12px 24px rgb(15 23 42 / 0.12);
      }

      .node span {
        color: var(--muted);
        font-size: 10px;
      }

      .node strong {
        display: block;
        margin-top: 5px;
        color: var(--ink);
        font-size: 11px;
        line-height: 1.45;
      }

      .node small {
        display: block;
        margin-top: 6px;
        color: var(--faint);
        font-size: 10px;
      }

      .graph-legend {
        position: absolute;
        bottom: 12px;
        left: 12px;
        z-index: 4;
        display: flex;
        gap: 11px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: rgb(255 255 255 / 0.92);
        color: var(--muted);
        font-size: 10px;
      }

      .graph-legend span {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .settings-layout {
        display: grid;
        gap: 12px;
        grid-template-columns: 290px minmax(0, 1fr);
      }

      .provider-list {
        padding: 8px;
      }

      .provider {
        display: grid;
        width: 100%;
        gap: 5px;
        margin-bottom: 5px;
        border: 1px solid transparent;
        border-radius: 7px;
        background: transparent;
        padding: 11px;
        color: var(--text);
        text-align: left;
      }

      .provider:hover {
        background: var(--surface-soft);
      }

      .provider.active {
        border-color: #bfdbfe;
        background: var(--surface-selected);
      }

      .provider strong {
        font-size: 12px;
      }

      .provider span {
        color: var(--muted);
        font-size: 11px;
      }

      .form-body {
        padding: 16px;
      }

      .form-grid {
        display: grid;
        gap: 14px;
        grid-template-columns: 1fr 1fr;
      }

      .form-label {
        display: grid;
        gap: 7px;
        color: var(--text);
        font-size: 11px;
        font-weight: 800;
      }

      .form-label.full {
        grid-column: 1 / -1;
      }

      .form-label input,
      .form-label select {
        height: 36px;
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        background: #ffffff;
        color: var(--text);
        padding: 0 10px;
        font-size: 12px;
      }

      .helper {
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
        line-height: 1.55;
      }

      .form-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }

      .connection {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--green);
        font-size: 11px;
        font-weight: 800;
      }

      .connection::before {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--green);
        content: "";
      }

      .settings-note {
        margin-top: 12px;
        padding: 12px 14px;
        border: 1px solid #bfdbfe;
        border-radius: 8px;
        background: #eff6ff;
        color: #1e40af;
        font-size: 11px;
        line-height: 1.65;
      }

      @media (max-width: 1280px) {
        .app {
          grid-template-columns: 224px minmax(0, 1fr);
        }

        .page {
          padding-right: 16px;
          padding-left: 16px;
        }

        .graph-layout {
          grid-template-columns: 190px minmax(0, 1fr) 270px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">TI</div>
          <div>
            <strong>趋势洞察</strong>
            <span>Research Console</span>
          </div>
        </div>

        <nav class="nav" aria-label="主导航">
          <div class="nav-section">WORKSPACE</div>
          <button class="nav-row" type="button"><span>资讯聚合</span><span>›</span></button>
          <button class="nav-row" type="button"><span>市场观察</span><span>›</span></button>
          <button class="nav-row" type="button"><span>事件洞察</span><span>⌄</span></button>
          <div class="nav-children">
            <button class="nav-child is-static" type="button">国内事件日历</button>
            <button class="nav-child" type="button">国际事件日历</button>
            <button class="nav-child active" data-view="events" type="button">事件列表</button>
            <button class="nav-child" data-view="trace" type="button">主题溯源</button>
            <button class="nav-child" data-view="graph" type="button">事件关系图</button>
          </div>
          <button class="nav-row" type="button"><span>宏观数据</span><span>›</span></button>

          <div class="nav-section">SYSTEM</div>
          <button class="nav-row" data-view="settings" type="button"><span>大模型配置</span><span>›</span></button>
        </nav>

        <div class="nav-foot">
          静态事件日历保持原有行为。<br />
          新增页面用于材料分析与证据追踪。
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <h1>事件洞察 · 前端页面 Mockup</h1>
            <p>可点击切换四个页面，审核布局、密度与信息优先级。</p>
          </div>

              配置建议：事件抽取优先使用速度较快、成本可控的模型；主题摘要和关系判断使用分析能力更强的模型。每项任务应允许独立选择模型配置，并保留失败重试与人工复核入口。
            </div>

            <div class="panel" style="margin-top: 12px">
              <div class="panel-head"><h3>任务默认模型</h3><span>按任务类型覆盖默认配置</span></div>
              <table>
                <thead><tr><th style="width: 34%">任务类型</th><th style="width: 36%">默认配置</th><th style="width: 30%">说明</th></tr></thead>
                <tbody>
                  <tr><td>材料事件抽取</td><td>快速抽取模型</td><td>速度优先，失败后降级到主分析模型</td></tr>
                  <tr><td>事件聚类与去重</td><td>主分析模型</td><td>需要更稳定的语义判断</td></tr>
                  <tr><td>主题摘要</td><td>主分析模型</td><td>生成阶段判断和待验证线索</td></tr>
                  <tr><td>事件关系建议</td><td>主分析模型</td><td>仅生成建议，人工确认后生效</td></tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </section>
    </template>

    <script>
      const pageRoot = document.querySelector("#pageRoot");
      const viewButtons = document.querySelectorAll("[data-view]");

      /**
       * 切换 Mockup 当前展示页面，并同步顶部切换器和侧栏高亮。
       *
       * @param {string} view 页面标识。
       * @returns {void}
       */
      function renderView(view) {
        const template = document.querySelector(`#${view}Template`);

        if (!template) return;

        pageRoot.replaceChildren(template.content.cloneNode(true));
        window.history.replaceState(null, "", `?view=${view}`);
        viewButtons.forEach((button) => {
          button.classList.toggle("active", button.dataset.view === view);
        });
      }

      viewButtons.forEach((button) => {
        button.addEventListener("click", () => renderView(button.dataset.view));
      });

      const initialView = new URLSearchParams(window.location.search).get("view") || "events";

      renderView(initialView);
    </script>
  </body>
</html>
